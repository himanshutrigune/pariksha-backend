spring:
  application:
    name: pariksha-backend
  threads:
    virtual:
      enabled: true            # Java 21 virtual threads (2026 trend)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pariksha_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Your password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none           # schema is created by schema.sql (src/main/resources)
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: always          # runs schema.sql then data.sql (idempotent) on every start
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    # Base64 encoded key (min 32 bytes). CHANGE for production and read from env var.
    secret: ${JWT_SECRET:r8FZ2MWpwUgmTpsoYacgJy1uhTnRg//4lPeHX7Sv8HmekWlX3NOB1RYB3hblbTaI}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed-demo-data: ${SEED_DEMO_DATA:true}
  exam:
    submit-grace-seconds: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
logging:
  level:
    com.pariksha: INFO
